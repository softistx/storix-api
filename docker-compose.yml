# Development services (ports bound to 127.0.0.1 only), started by `bun run dev` (`bun run services:up`). Host ports come
# from .env and default to the values below, which differ from pulsarix-api's and operix-api's so the
# stacks can run side by side. Nothing here is a deployment.
#
# MongoDB: a one-node replica set (transactions need one) at
# mongodb://localhost:27019/?replicaSet=rs0&directConnection=true.
# Redis: redis://localhost:6381 (rate limits, queues, tokens).
# Mailpit: SMTP smtp://localhost:1027, messages at http://localhost:8027.
# SeaweedFS: S3 API http://localhost:8333, storix-dev / storix-dev-secret (docker/seaweedfs-s3.json).
# Every service has CPU and memory limits, and its healthcheck is light (30 s, a TCP probe or a ping;
# `start_interval`, Compose 2.20+ and Engine 25+, keeps start-up fast). Start the stack with
# `bun run services:up`, not a bare `docker compose up`: it also runs the one-shots of the `init`
# profile (`mongo-init` starts the replica set, `media-bucket` creates the bucket).
# Images are pinned (mongo 8.3, Redis 8.12 and SeaweedFS 4.55 by multi-arch index digest, the bucket client by digest): bump them on purpose.
name: storix-api
services:
  mongo:
    image: mongo:8.3
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo-data:/data/db
    # A TCP probe: no mongosh runtime per check. `mongo-init` sets up the replica set once.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  # One-shot (`services:up` runs it): starts the replica set if needed and
  # waits until this node is the writable primary, then exits.
  mongo-init:
    image: mongo:8.3
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - mongosh
      - "mongodb://mongo:27017/?directConnection=true"
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; const end = Date.now() + 60000; while (!db.hello().isWritablePrimary) { if (Date.now() > end) throw new Error('no primary after 60 s'); sleep(500) }"
    profiles: [init]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  redis:
    image: redis:8.12@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1027}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8027}:8025"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  # SeaweedFS: master, volume server and S3 gateway in one process.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command:
      ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # One-shot: creates the private bucket and exits.
  media-bucket:
    profiles: [init]
    image: cgr.dev/chainguard/minio-client@sha256:59f1924e417b6fcfdc0aca321e3bdebe8a56fd0efa7da80037d5eb65a203d687
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      MC_HOST_local: http://storix-dev:storix-dev-secret@seaweedfs:8333
    command: ["mb", "--ignore-existing", "local/storix-files"]
    restart: on-failure
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

volumes:
  mongo-data:
  seaweed-data:
