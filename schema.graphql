"""A person in a workspace."""
type Member {
  """The account's opaque id."""
  accountId: ID!
  """The account's address; null when the account no longer exists."""
  email: EmailAddress
  id: ID!
  joinedAt: DateTime!
  """The account's name; null when the account no longer exists."""
  name: String
  role: WorkspaceRole!
}

"""A page of members."""
type MemberPage {
  nodes: [Member!]!
  pageInfo: PageInfo!
  """Every current member of the workspace."""
  totalCount: Int!
}

type Mutation {
  """
  Accepts the invitation `code` names: the code proves the invitee's inbox.
  A new invitee, an account whose e-mail was never proved, or a proved account
  with no password yet (given one) is signed in (the session cookie, or `token`
  with `answerToken`); a proved user who already has a password (the password
