A signed JSON Web Token in compact form. Its signature is not verified.
"""
scalar JWT @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc7519")

"""A KSUID: 27 characters of base62."""
scalar KSUID @specifiedBy(url: "https://github.com/segmentio/ksuid")

"""The languages the API speaks."""
enum Language {
  EN
  FR
}

"""A latitude in decimal degrees, from -90 to 90."""
scalar Latitude

"""A date and a time with no offset, such as 2024-03-10T10:15:30."""
scalar LocalDateTime

"""A time of day with no offset, such as 10:15 or 10:15:30."""
scalar LocalTime

"""A BCP 47 language tag in canonical form, such as fr-FR."""
scalar Locale @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc5646")

"""
A signed 64-bit integer, as a decimal string (a safe-integer number is accepted as input).
"""
scalar Long

"""A longitude in decimal degrees, from -180 to 180."""
scalar Longitude

"""
A MAC address: six hex pairs separated by colons (not the IEEE hyphen form).
"""
scalar MAC

type Mutation {
  """
  The first code of the app: the factor is active, its ten recovery codes are answered once, the account's other sessions end. Needs a fresh session.
  """
  activateSecondFactor(code: String! @constraint(maxLength: 40)): RecoveryCodes!
  """
  Ends a sign-up: the token of the verification mail and the password the
  visitor chose, posted together. Proves the address, sets the password and
  signs in. 400 `identity.errors.token-invalid`; 400
  `validation.errors.invalid-input` (`too-short` on `password`) with the link
  NOT spent.
  """
  completeSignUp(password: String! @constraint(maxLength: 1024), token: String! @constraint(maxLength: 200)): SignInPayload!
  """
  The code of the authenticator app, for the challenge signIn answered. 400 `identity.errors.second-factor-invalid` (with `attemptsLeft`); 400 `identity.errors.token-invalid`.
  """
  confirmSecondFactor(challenge: String! @constraint(maxLength: 200), code: String! @constraint(maxLength: 40)): SignInPayload!
  """
  Confirms a step-up and answers until when the session is fresh. 400 `identity.errors.second-factor-invalid`.
  """
  confirmStepUp(challenge: String! @constraint(maxLength: 200), code: String! @constraint(maxLength: 40)): DateTime!
  """
  Turns the factor off on a current code of the app. Needs a fresh session.
  """
  disableSecondFactor(code: String! @constraint(maxLength: 40)): Boolean!
  """
  Starts a second factor. Needs a verified address (403 `identity.errors.email-unverified`) and a fresh session (403 `auth.errors.step-up-required`).
  """
  enrolSecondFactor: SecondFactorEnrolment!
  """
  A recovery code instead of the app's; each works once. Refused as confirmSecondFactor.
  """
  recoverSecondFactor(challenge: String! @constraint(maxLength: 200), recoveryCode: String! @constraint(maxLength: 40)): SignInPayload!
  """
  Ten new recovery codes on a current code of the app; the old ones end. Needs a fresh session.
  """
  regenerateRecoveryCodes(code: String! @constraint(maxLength: 40)): RecoveryCodes!
  """
  Sends a password-reset link. True once accepted, whether or not the e-mail holds an account; 429 `auth.errors.rate-limited` past five per ten minutes for an address.
  """
  requestPasswordReset(email: String! @constraint(maxLength: 320)): Boolean!
  """
  Starts a step-up of the session: a code of the app, else a code mailed to the account. 401 `auth.errors.unauthenticated`.
  """
  requestStepUp: StepUpChallenge!
  """
  Mails the verification link again to the signed-in account; true also when it is verified. 401 `auth.errors.unauthenticated`; 429 `auth.errors.rate-limited`.
  """
  resendVerificationEmail: Boolean!
  """
  Sets a new password with the token of the reset mail and signs the account out everywhere. 400 `identity.errors.token-invalid`; 400 `validation.errors.invalid-input`.
  """
  resetPassword(password: String! @constraint(maxLength: 1024), token: String! @constraint(maxLength: 200)): Boolean!
  """
  Signs in with a password. 401 `identity.errors.invalid-credentials` for a
  wrong password, an unknown address and a deactivated account alike; 429
  `auth.errors.rate-limited`.
  """
  signIn(input: SignInInput!): SignInPayload!
  """Ends the request's session. True also when there was none."""
  signOut: Boolean!
  """
  Opens an account with NO password, unverified, and mails the verification
  link. Opens no session: answers VERIFICATION_SENT. An address that already
  holds an account answers the very same payload and creates nothing (its owner
  is mailed a notice), so the answer never tells whether an address is taken.
  """
  signUp(input: SignUpInput!): SignInPayload!
}

"""A Nano ID: 21 characters of A-Z, a-z, 0-9, _ and -."""
scalar NanoID @specifiedBy(url: "https://github.com/ai/nanoid")

"""A finite number below 0."""
scalar NegativeFloat

"""An integer from -2147483648 to -1."""
scalar NegativeInt

"""A string that is not empty and not only white space."""
scalar NonEmptyString

"""A finite number, 0 or above."""
scalar NonNegativeFloat

"""An integer from 0 to 2147483647."""
scalar NonNegativeInt

"""A finite number, 0 or below."""
scalar NonPositiveFloat

"""An integer from -2147483648 to 0."""
scalar NonPositiveInt

"""A MongoDB ObjectId: 24 hexadecimal digits."""
scalar ObjectID @specifiedBy(url: "https://www.mongodb.com/docs/manual/reference/method/ObjectId/")

"""
Where a page of a list ends. Paging is forward only: `endCursor` is the
`after` of the next page; to go back, a client keeps the cursors it has
visited. `startCursor` is the `after` this page was asked with, and
`hasPreviousPage` says whether it was given.
"""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""A phone number in E.164 form, such as +33612345678."""
scalar PhoneNumber @specifiedBy(url: "https://www.itu.int/rec/T-REC-E.164")

"""A TCP or UDP port number, from 0 to 65535."""
scalar Port

"""A finite number above 0."""
scalar PositiveFloat

"""An integer from 1 to 2147483647."""
scalar PositiveInt

type Query {
  """
  The API's error messages in one language, for a client that words refusals
  itself. A refusal carries `extensions.code` and `extensions.params`; the
  client finds the code in `messages` and fills the message with the params.
  The language defaults to the request's. Cache a catalogue per language by
  `version`.
  """
  errorCatalogue(language: Language): ErrorCatalogue!
  """
  Whether the caller's second factor is on and how many recovery codes are left. 401 `auth.errors.unauthenticated`.
  """
  secondFactorStatus: SecondFactorStatus!
  version: String!
  """The caller, or null when anonymous."""
  viewer: Viewer
}

"""A CSS rgb() color, such as rgb(255, 0, 0)."""
scalar RGB @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#rgb-functions")

"""A CSS rgba() color, such as rgba(255, 0, 0, 0.5)."""
scalar RGBA @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#rgb-functions")

"""
The recovery codes of a second factor: ten single-use codes, shown once.
"""
type RecoveryCodes {
  recoveryCodes: [String!]!
}

"""A SHA-256 digest: 64 hexadecimal digits."""
scalar SHA256 @specifiedBy(url: "https://csrc.nist.gov/pubs/fips/180-4/upd1/final")

"""A SHA-512 digest: 128 hexadecimal digits."""
scalar SHA512 @specifiedBy(url: "https://csrc.nist.gov/pubs/fips/180-4/upd1/final")

"""An integer from -9007199254740991 to 9007199254740991."""
scalar SafeInt

"""The authenticator-app secret of a second factor being enrolled."""
type SecondFactorEnrolment {
  """Base32, for a user who types it in."""
  secret: String!
  """otpauth://, to show as a QR code."""
  uri: String!
}

type SecondFactorStatus {
  enabled: Boolean!
  """Null when the factor is off."""
  recoveryCodesLeft: Int
}

"""A Semantic Versioning 2.0.0 version, such as 1.0.0-rc.1."""
scalar SemVer @specifiedBy(url: "https://semver.org/spec/v2.0.0.html")

"""The credentials of a password sign-in."""
input SignInInput {
  """The account's address, at most 320 characters."""
  email: String! @constraint(maxLength: 320)
  """The password, at most 1024 characters."""
  password: String! @constraint(maxLength: 1024)
}

type SignInPayload {
  """SECOND_FACTOR: keep it for the next call only."""
  challenge: String
  """
  SIGNED_IN: when the session ends. SECOND_FACTOR: when the challenge does.
  """
  expiresAt: DateTime
  status: SignInStatus!
  """The session token, set only with SIGNED_IN."""
  token: String
  """The signed-in account, set only with SIGNED_IN."""
  viewer: Viewer
}

"""What a sign-in or sign-up step answered and what the client does next."""
enum SignInStatus {
  """
  The password was right and the account has a second factor: send a code with `challenge` to confirmSecondFactor (or a recovery code to recoverSecondFactor) before `expiresAt`.
  """
  SECOND_FACTOR
  """
  Signed in: `token` is the session's, to send as `Authorization: Bearer`.
  """
  SIGNED_IN
  """
  A sign-up was accepted: the verification link is mailed and no session was opened, whether or not the address already held an account.
  """
  VERIFICATION_SENT
}

"""
What opening an account needs. No password: the visitor chooses it from the verification link.
"""
input SignUpInput {
  """The address to verify and sign in with."""
  email: EmailAddress!
  """The language of the mails to this account."""
  locale: Language!
  """Display name, 1 to 200 characters."""
  name: String! @constraint(minLength: 1, maxLength: 200)
}

"""
The direction of a list's `orderBy`. Every sorted list also orders by `id` after
its `orderBy`, so a cursor page across a sort neither skips nor repeats a row.
"""
enum SortDirection {
  ASC
  DESC
}

"""
A step-up under way: keep `challenge` (never in a URL) and post it to confirmStepUp with the code.
"""
type StepUpChallenge {
  """Opaque, single-use value to post to `confirmStepUp` with the code."""
  challenge: String!
  """When the challenge and its code stop working."""
  expiresAt: DateTime!
  method: StepUpMethod!
}

"""How a step-up is confirmed."""
enum StepUpMethod {
  """
  A code of the authenticator app: the account has an active second factor. Nothing is mailed.
  """
  AUTHENTICATOR
  """A six-digit code mailed to the account's current address."""
  EMAIL
}

"""A time of day with its offset, such as 10:15:30Z (RFC 3339 full-time)."""
scalar Time @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339#section-5.6")

"""An IANA time zone name, such as Europe/Paris."""
scalar TimeZone @specifiedBy(url: "https://www.iana.org/time-zones")

"""
An instant, as an integer number of milliseconds since 1970-01-01T00:00:00Z.
"""
scalar Timestamp

"""A ULID: 26 characters of Crockford base32."""
scalar ULID @specifiedBy(url: "https://github.com/ulid/spec")

"""An absolute http or https URL."""
scalar URL @specifiedBy(url: "https://url.spec.whatwg.org/")

"""A UUID in its 8-4-4-4-12 hexadecimal form."""
scalar UUID @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 4 (random) UUID."""
scalar UUIDv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 7 (time-ordered) UUID."""
scalar UUIDv7 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A UTC offset from -12:00 to +14:00, such as +05:30."""
scalar UtcOffset

"""
Who is calling. `viewer` is null for an anonymous request. A session and a
personal API key both answer here; a key has no session (`apiKeyId` is set and
the session fields are null).
"""
type Viewer {
  """The id of the API key the call came in with; null for a session."""
  apiKeyId: ID
  email: EmailAddress!
  """Whether the address was proved (the verification link)."""
  emailVerified: Boolean!
  """Whether an authenticator app protects the account."""
  hasSecondFactor: Boolean!
  """The account's opaque id."""
  id: ID!
  """The language of the account's mails."""
  locale: Language!
  name: String!
  """
  Until when the session counts as fresh for sensitive operations (sign-in or last step-up, plus 10 minutes); null for an API key, which is never fresh.
  """
  sessionConfirmedUntil: DateTime
  """When the session ends; null for an API key."""
  sessionExpiresAt: DateTime
}

"""No value: always null."""
scalar Void

"""An xid: 20 characters of lowercase base32hex."""
scalar XID @specifiedBy(url: "https://github.com/rs/xid")
