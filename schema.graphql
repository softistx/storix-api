schema {
  query: Query
  mutation: Mutation
}

"""
Only a signed-in user reaches this field, or every field of this type or
interface. With `type`, only a user of one of these user types: any other is
answered FORBIDDEN.
"""
directive @authenticated(type: [String!]) on FIELD_DEFINITION | INTERFACE | OBJECT

"""
Validates an argument or an input field when the request arrives, before the resolver runs. A value that breaks a constraint is refused with a BAD_USER_INPUT error whose extensions list each issue with its path and the constraint that refused it; null and omitted values are not checked. Each argument below is one constraint, and they combine on one field.
"""
directive @constraint(
  """
  The string must contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  contains: String
  """
  The string must end with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  endsWith: String
  """
  The number must be strictly less than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMax: Float
  """
  The number must be strictly greater than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMin: Float
  """
  The string must match this named format: byte, date, date-time, email, ipv4, ipv6, uri or uuid, or a format the server registered. An unknown name fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  format: String
  """
  The number must be less than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  max: Float
  """
  The list must hold at most this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  maxItems: Int
  """
  The string must be at most this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  maxLength: Int
  """
  The number must be greater than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  min: Float
  """
  The list must hold at least this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  minItems: Int
  """
  The string must be at least this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  minLength: Int
  """
  The number must be a whole multiple of this value (for example 5 accepts 0, 5 and 10). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  multipleOf: Float
  """
  The string must not contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  notContains: String
  """
  The string must match this regular expression (JavaScript syntax, not anchored unless it uses ^ and $). An invalid expression fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  pattern: String
  """
  The string must start with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  startsWith: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Only a session that proved who it is less than `maxAge` seconds ago reaches
this field, or every field of this type or interface: signed in, or confirmed
since by a step-up. Anonymous is answered UNAUTHENTICATED, an older session
STEP_UP_REQUIRED. Where several apply, the smallest `maxAge` holds.
"""
directive @fresh(maxAge: Int!) on FIELD_DEFINITION | INTERFACE | OBJECT

"""
Only a user holding permission `name` on the object of `type` whose id `id`
reads reaches this field, or every field of this type or interface. `id` is
`args.<path>` or `parent.<path>`: `args.id` on a field and `parent.id` on a
type or an interface when absent. A list of ids requires the permission on
every one. Repeated, every one must hold, in the order written.
"""
directive @permission(id: String, name: String!, onDeny: JanusPermissionDenial! = NOT_FOUND, type: String!) repeatable on FIELD_DEFINITION | INTERFACE | OBJECT

type AuditActor {
  """The account id (or key, token or link id)."""
  id: ID!
  """The name the actor had when it happened; null when it had none."""
  label: String
  type: AuditActorType!
}

"""Who did it."""
enum AuditActorType {
  """A workspace API key."""
  API_KEY
  """A share link."""
  LINK
  """A signed-in account."""
  MEMBER
  """A scoped access token."""
  TOKEN
}

"""
One thing that happened in the workspace. Never holds an address, a code, a password or a token.
"""
type AuditEvent {
  """
  `<area>.<verb>`: workspace.create, member.role-change, member.remove, member.leave, invitation.issue, invitation.resend, invitation.revoke, invitation.accept, team.create, team.rename, team.set-members, team.delete.
  """
  action: String!
  actor: AuditActor!
  at: DateTime!
  id: ID!
  """
  A keyed hash of the client address; null when the request had none. Equal hashes are the same address.
  """
  ipHash: String
  """
  Short facts about the change (a role's before and after, a team's new name): strings, numbers and booleans.
  """
  meta: JSONObject!
  target: AuditTarget!
}

input AuditEventFilter {
  """Events of exactly this action."""
  action: String
  """Events of this actor (an account id)."""
  actorId: ID
  """Events at or after this instant."""
  from: DateTime
  """
  Events about this target (a member, an invitation, a team, the workspace).
  """
  targetId: ID
  """Events before this instant."""
  to: DateTime
}

"""A page of audit events, newest first."""
type AuditPage {
  nodes: [AuditEvent!]!
  pageInfo: PageInfo!
}

type AuditTarget {
  id: ID!
  """The target's name when it had one; null otherwise."""
  name: String
  """What was acted on: WORKSPACE, MEMBER, INVITATION, TEAM."""
  type: String!
}

