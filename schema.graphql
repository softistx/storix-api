"""A CSS hexadecimal color, such as #ff0000."""
scalar HexColorCode @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#hex-notation")

"""A non-empty string of hexadecimal digits."""
scalar Hexadecimal

"""A host name, such as api.example.com."""
scalar Hostname @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc1123")

"""
An International Bank Account Number, electronic form, such as FR1420041010050500013M02606.
"""
scalar IBAN @specifiedBy(url: "https://www.iso.org/standard/81090.html")

"""An IPv4 or IPv6 address."""
scalar IP @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""An IPv4 address in dotted-quad form."""
scalar IPv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc791")

"""An IPv6 address."""
scalar IPv6 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""An ISBN-10 or ISBN-13, digits only, with its check digit verified."""
scalar ISBN @specifiedBy(url: "https://www.isbn-international.org/content/isbn-users-manual/29")

"""Any JSON value."""
scalar JSON @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259")

"""A JSON object."""
scalar JSONObject @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259#section-4")

