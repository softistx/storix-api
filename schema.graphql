schema {
  query: Query
  mutation: Mutation
}

"""
Only a signed-in user reaches this field, or every field of this type or
interface. With `type`, only a user of one of these user types: any other is
answered FORBIDDEN.
"""
directive @authenticated(type: [String!]) on FIELD_DEFINITION | INTERFACE | OBJECT

"""
Validates an argument or an input field when the request arrives, before the resolver runs. A value that breaks a constraint is refused with a BAD_USER_INPUT error whose extensions list each issue with its path and the constraint that refused it; null and omitted values are not checked. Each argument below is one constraint, and they combine on one field.
"""
directive @constraint(
  """
  The string must contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  contains: String
  """
  The string must end with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  endsWith: String
  """
  The number must be strictly less than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMax: Float
  """
  The number must be strictly greater than this value (the value itself is refused). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  exclusiveMin: Float
  """
  The string must match this named format: byte, date, date-time, email, ipv4, ipv6, uri or uuid, or a format the server registered. An unknown name fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  format: String
  """
  The number must be less than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  max: Float
  """
  The list must hold at most this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  maxItems: Int
  """
  The string must be at most this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  maxLength: Int
  """
  The number must be greater than or equal to this value (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  min: Float
  """
  The list must hold at least this many items (inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to list values.
  """
  minItems: Int
  """
  The string must be at least this many characters long (UTF-16 code units, inclusive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  minLength: Int
  """
  The number must be a whole multiple of this value (for example 5 accepts 0, 5 and 10). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to Int and Float values.
  """
  multipleOf: Float
  """
  The string must not contain this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  notContains: String
  """
  The string must match this regular expression (JavaScript syntax, not anchored unless it uses ^ and $). An invalid expression fails at server startup. Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  pattern: String
  """
  The string must start with this text (case-sensitive). Refused otherwise with a BAD_USER_INPUT error naming the constraint. Applies to String and ID values.
  """
  startsWith: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
The cost of a field, type, enum, scalar, argument or input field in the query cost limit, following the IBM GraphQL cost specification.
"""
directive @cost(
  """
  The cost it adds; it replaces the default object or scalar cost for what it marks, and on a field it is added once, not per list item.
  """
  weight: Int!
) on ARGUMENT_DEFINITION | ENUM | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | OBJECT | SCALAR

"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean! = true
  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
Only a session that proved who it is less than `maxAge` seconds ago reaches
this field, or every field of this type or interface: signed in, or confirmed
since by a step-up. Anonymous is answered UNAUTHENTICATED, an older session
STEP_UP_REQUIRED. Where several apply, the smallest `maxAge` holds.
"""
directive @fresh(maxAge: Int!) on FIELD_DEFINITION | INTERFACE | OBJECT

"""
How many items a list field returns, used to multiply its cost in the query cost limit, following the IBM GraphQL cost specification.
"""
directive @listSize(
  """
  The list size to assume when no slicing argument gives one; it defaults to the server limits.cost.defaultListSize (10 unless configured) and it also sizes the inner levels of a nested list.
  """
  assumedSize: Int
  """
  Whether a request must give a non-negative integer for at least one slicing argument, otherwise it is rejected; true by default.
  """
  requireOneSlicingArgument: Boolean = true
  """
  The fields of the returned object that hold the list (for example the edges of a connection), each sized like this field instead of once.
  """
  sizedFields: [String!]
  """
  The names of the arguments (a dotted path reaches into an input) whose non-negative integer value is the list size; the largest given one is used.
  """
  slicingArguments: [String!]
) on FIELD_DEFINITION

"""
Only a user holding permission `name` on the object of `type` whose id `id`
reads reaches this field, or every field of this type or interface. `id` is
`args.<path>` or `parent.<path>`: `args.id` on a field and `parent.id` on a
type or an interface when absent. A list of ids requires the permission on
every one. Repeated, every one must hold, in the order written.
"""
directive @permission(id: String, name: String!, onDeny: JanusPermissionDenial! = NOT_FOUND, type: String!) repeatable on FIELD_DEFINITION | INTERFACE | OBJECT

"""
Directs the executor to stream plural fields when the `if` argument is true or undefined.
"""
directive @stream(
  """Stream when true or undefined."""
  if: Boolean! = true
  """Number of items to return immediately"""
  initialCount: Int! = 0
  """Unique name"""
  label: String
) on FIELD

"""
One standing session of the caller's account. The token is never shown.
"""
type AccountSession {
  createdAt: DateTime!
  """Whether this is the session the request came in with."""
  current: Boolean!
  """
  What the client said it was (its User-Agent): show it, never trust it. Null when none was recorded.
  """
  device: String
  expiresAt: DateTime!
  id: ID!
  """
  When the session was last opened or renewed (at most once a day); null before it was recorded.
  """
  lastUsedAt: DateTime
}

input AddFileInput {
  """
  The key `PUT /media/files` answered: the object must be in this workspace, of the `files` kind, and not recorded yet.
  """
  key: String! @constraint(minLength: 1, maxLength: 100)
  """
  The file's name: trimmed, at most 255 characters, no `/`, `\` or control character.
  """
  name: String! @constraint(minLength: 1, maxLength: 255)
  onConflict: OnConflict! = REFUSE
  """The folder of the caller's tree to put the file in."""
  parentId: ID!
}

type AuditActor {
  """The account id (or key, token or link id)."""
  id: ID!
  """The name the actor had when it happened; null when it had none."""
  label: String
  type: AuditActorType!
}

"""Who did it."""
enum AuditActorType {
  """A workspace API key."""
  API_KEY
  """A share link."""
  LINK
  """A signed-in account."""
  MEMBER
  """A scoped access token."""
  TOKEN
}

"""
One thing that happened in the workspace. Never holds an address, a code, a password or a token.
"""
type AuditEvent {
  """
  `<area>.<verb>`: workspace.create, member.role-change, member.remove, member.leave, invitation.issue, invitation.resend, invitation.revoke, invitation.accept, team.create, team.rename, team.set-members, team.delete, node.folder-create, node.rename, node.move, node.copy, file.add, file.update, file.focal, node.trash, node.restore, node.purge, trash.empty, workspace.settings, workspace.rename, quota.exceeded.
  """
  action: String!
  actor: AuditActor!
  at: DateTime!
  id: ID!
  """
  A keyed hash of the client address; null when the request had none. Equal hashes are the same address.
  """
  ipHash: String
  """
  Short facts about the change (a role's before and after, a team's new name): strings, numbers and booleans.
  """
  meta: JSONObject!
  target: AuditTarget!
}

input AuditEventFilter {
  """Events of exactly this action."""
  action: String
  """Events of this actor (an account id)."""
  actorId: ID
  """Events at or after this instant."""
  from: DateTime
  """
  Events about this target (a member, an invitation, a team, the workspace).
  """
  targetId: ID
  """Events before this instant."""
  to: DateTime
}

"""A page of audit events, newest first."""
type AuditPage {
  nodes: [AuditEvent!]!
  pageInfo: PageInfo!
}

type AuditTarget {
  id: ID!
  """The target's name when it had one; null otherwise."""
  name: String
  """What was acted on: WORKSPACE, MEMBER, INVITATION, TEAM."""
  type: String!
}

"""Standard base64 with padding, in its canonical spelling."""
scalar Base64 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4648#section-4")

"""URL-safe base64 without padding, in its canonical spelling."""
scalar Base64URL @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4648#section-5")

"""
An integer of any size, as a decimal string (a safe-integer number is accepted as input).
"""
scalar BigInt

"""An IPv4 block in CIDR notation, such as 10.0.0.0/8."""
scalar CIDRv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4632")

"""An IPv6 block in CIDR notation, such as 2001:db8::/32."""
scalar CIDRv6 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""An ISO 3166-1 alpha-2 country code, such as FR."""
scalar CountryCode @specifiedBy(url: "https://www.iso.org/iso-3166-country-codes.html")

input CreateWorkspaceInput {
  """1 to 100 characters, spaces around are dropped."""
  name: String! @constraint(minLength: 1, maxLength: 100)
  """
  1 to 40 characters: lower case letters, digits and hyphens, not starting or ending with a hyphen, and not 24 hexadecimal digits (an id).
  """
  slug: String! @constraint(minLength: 1, maxLength: 40, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$")
}

"""
A cuid2: a lowercase letter, then lowercase letters and digits, 2 to 32 in all.
"""
scalar Cuid2 @specifiedBy(url: "https://github.com/paralleldrive/cuid2")

"""An ISO 4217 currency code, such as EUR."""
scalar Currency @specifiedBy(url: "https://www.iso.org/iso-4217-currency-codes.html")

"""A calendar date, YYYY-MM-DD, with no time and no time zone."""
scalar Date @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339#section-5.6")

"""An instant: an RFC 3339 date-time with its offset."""
scalar DateTime @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339")

"""An ISO 8601 duration, such as P1DT2H or PT0.5S."""
scalar Duration @specifiedBy(url: "https://www.iso.org/iso-8601-date-and-time-format.html")

"""An email address."""
scalar EmailAddress

"""One emoji, such as 👍."""
scalar Emoji @specifiedBy(url: "https://www.unicode.org/reports/tr51/")

type ErrorCatalogue {
  language: Language!
  """
  Every error code in code order, each in the language or, where it has no text, in English (the fallback).
  """
  messages: [ErrorMessage!]!
  """
  Changes whenever a text of the language's catalogue, or of English's which
  fills it, changes (a deploy that adds or rewords one); it is the same after a
  restart. It may also change for a text that is no error message. Selecting
  it alone reads no message.
  """
  version: String!
}

type ErrorMessage {
  """`<module>.errors.<slug>`: the `extensions.code` the API answers."""
  code: String!
  """The ICU message, uninterpolated, that `extensions.params` fill."""
  message: String!
}

"""A file: a node that holds a stored object (`addFile` records it)."""
type File implements Node {
  ancestors: [ID!]!
  createdAt: DateTime!
  depth: Int!
  family: FileFamily!
  """Where the crops are centred; null is the centre of the picture."""
  focalPoint: FocalPoint
  grants: [Grant!]!
  id: ID!
  """
  The media key of the object: `GET /media/files/<key>` reads it. Never a URL.
  """
  key: String!
  meta: JSONObject!
  """The content type the storage reported when the file was uploaded."""
  mimeType: String!
  myRole: Role!
  name: String!
  owner: NodeOwner
  ownerId: ID
  parentId: ID
  """One of the renditions, or null when the file does not have it (yet)."""
  rendition(preset: RenditionPreset!): Rendition
  """
  The sizes available now: every one of a `READY` picture, `THUMB` and
  `PREVIEW` of a `READY` PDF. Empty while the file is `PROCESSING` or `FAILED`
  and for any other type.
  """
  renditions: [Rendition!]!
  """The size in bytes, as the storage reported it."""
  size: Float!
  status: FileStatus!
  tags: [String!]!
  trashedAt: DateTime
  trashedBy: String
  type: NodeType!
  updatedAt: DateTime!
  version: Int!
  """
  The versions of the file, newest first. A file made before versions existed
  gets its version 1 the first time they are read. Needs `nodes:read`.
  """
  versions: [FileVersion!]!
}

enum FileFamily {
  ARCHIVE
  AUDIO
  """Source and data text: JSON, XML, scripts, other text types."""
  CODE
  """Word-processing documents and plain text."""
  DOCUMENT
  IMAGE
  OTHER
  PDF
  PRESENTATION
  SPREADSHEET
  VIDEO
}

"""
Where a file stands in its renditions. READY: nothing is pending (also the
status of every file when no worker runs). PROCESSING: a worker is making the
thumbnail and crops. FAILED: only the previews failed; the original stays
downloadable, and a size stored before the failure may still be served.
"""
enum FileStatus {
  FAILED
  PROCESSING
  READY
}

"""One version of a file: the blob it held from this number on."""
type FileVersion {
  createdAt: DateTime!
  """The account id of whoever made the version."""
  createdBy: String!
  """The version the file shows now; it is never deleted."""
  current: Boolean!
  id: ID!
  """
  The media key of this version's object: `GET /media/files/<key>` reads it while the file is in the caller's tree.
  """
  key: String!
  mimeType: String!
  note: String
  """1 for the first, then up by one with each version made; never reused."""
  number: Int!
  """The number of the version a restore copied; null for an upload."""
  restoredFrom: Int
  """The size in bytes, as the storage reported it."""
  size: Float!
}

"""A point of a picture, as fractions of it from its top left corner."""
type FocalPoint {
  x: Float!
  y: Float!
}

"""
Both coordinates are numbers from 0 to 1 (`files.errors.invalid-focal`).
"""
input FocalPointInput {
  x: Float!
  y: Float!
}

type Folder implements Node {
  ancestors: [ID!]!
  createdAt: DateTime!
  depth: Int!
  grants: [Grant!]!
  id: ID!
  myRole: Role!
  name: String!
  owner: NodeOwner
  ownerId: ID
  parentId: ID
  trashedAt: DateTime
  trashedBy: String
  type: NodeType!
  updatedAt: DateTime!
  version: Int!
}

"""A GUID: 8-4-4-4-12 hexadecimal digits, with no version check."""
scalar GUID

"""
One share of a node: a member or a team, and the role they hold on it and everything under it.
"""
type Grant {
  createdAt: DateTime!
  """The account id of whoever shared."""
  grantedBy: String!
  id: ID!
  nodeId: ID!
  principal: GrantPrincipal!
  role: GrantRole!
}

"""Who a grant is for."""
type GrantPrincipal {
  id: ID!
  type: GrantPrincipalType!
}

input GrantPrincipalInput {
  id: ID!
  type: GrantPrincipalType!
}

enum GrantPrincipalType {
  """A member of the workspace: the id is a `Member.id`."""
  MEMBER
  """A team of the workspace: the id is a `Team.id`."""
  TEAM
}

"""
What a node is shared as: VIEWER lists, previews and downloads; EDITOR adds upload, rename, move inside, new versions, trash and sharing.
"""
enum GrantRole {
  EDITOR
  VIEWER
}

"""A CSS hsl() color, such as hsl(120, 100%, 50%)."""
scalar HSL @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#the-hsl-notation")

"""A CSS hsla() color, such as hsla(120, 100%, 50%, 0.5)."""
scalar HSLA @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#the-hsl-notation")

"""A CSS hexadecimal color, such as #ff0000."""
scalar HexColorCode @specifiedBy(url: "https://www.w3.org/TR/css-color-4/#hex-notation")

"""A non-empty string of hexadecimal digits."""
scalar Hexadecimal

"""A host name, such as api.example.com."""
scalar Hostname @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc1123")

"""
An International Bank Account Number, electronic form, such as FR1420041010050500013M02606.
"""
scalar IBAN @specifiedBy(url: "https://www.iso.org/standard/81090.html")

"""An IPv4 or IPv6 address."""
scalar IP @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""An IPv4 address in dotted-quad form."""
scalar IPv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc791")

"""An IPv6 address."""
scalar IPv6 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""An ISBN-10 or ISBN-13, digits only, with its check digit verified."""
scalar ISBN @specifiedBy(url: "https://www.isbn-international.org/content/isbn-users-manual/29")

union InvitationAcceptResult = InvitationSecondFactor | InvitationSignIn | InvitationSignedIn

"""
The invitation was accepted and a second factor is still to prove: confirm
it with the challenge. No session is open yet. The challenge is a secret:
never in a URL or a log.
"""
type InvitationSecondFactor {
  challenge: String!
  """When the challenge lapses, as an ISO-8601 string."""
  expiresAt: String!
  invitationId: ID!
  """
  What can answer the challenge: `totp` always, and `passkey` when the
  user holds one.
  """
  methods: [String!]!
  """
  The JSON text for `navigator.credentials.get({ publicKey })`, present
  exactly when `methods` holds `passkey`.
  """
  passkeyOptions: String
  scope: String!
}

"""
The address belongs to a proved user who already has a password (the password
given is ignored), or who has none and gave none. They are NOT signed in: an
invitation proves the inbox, not who holds the account. Send them to the
sign-in page.
"""
type InvitationSignIn {
  email: String!
  invitationId: ID!
  scope: String!
}

"""
The invitation was accepted and a session was opened: a new invitee, an
account whose e-mail was never proved, or a proved account with no password
yet, given one.
"""
type InvitationSignedIn {
  """When the session ends, as an ISO-8601 string."""
  expiresAt: String!
  invitationId: ID!
  newDevice: Boolean!
  role: WorkspaceRole!
  scope: String!
  """
  The session token, only with `answerToken`; otherwise the session
  cookie is set and this is null.
  """
  token: String
  userId: ID!
}

"""Any JSON value."""
scalar JSON @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259")

"""A JSON object."""
scalar JSONObject @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259#section-4")

"""
A signed JSON Web Token in compact form. Its signature is not verified.
"""
scalar JWT @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc7519")

"""
An invitation into a scope (an organization, a team), as its owners see it.
The code is never here: `issueInvitation` and `resendInvitation` answer it
once.
"""
type JanusInvitation {
  acceptedAt: String
  acceptedBy: ID
  """Timestamps, as ISO-8601 strings."""
  createdAt: String!
  email: String!
  expiresAt: String!
  id: ID!
  """The id of the user who sent it, or null when the system issued it."""
  invitedBy: ID
  locale: String
  name: String!
  """
  The application's opaque reference the invitation was issued with (its own
  record), or null.
  """
  ref: String
  """The id of the user who last sent it again, or null."""
  resentBy: ID
  revokedAt: String
  """The id of the user who revoked it, or null."""
  revokedBy: ID
  role: WorkspaceRole!
  """The organization (or any grouping) the invitation is into."""
  scope: String!
  """
  `pending`, `accepted` or `revoked`. A `pending` invitation past
  `expiresAt` is lapsed: it cannot be previewed or accepted, and
  `resendInvitation` gives it a new code.
  """
  status: String!
  """
  The user type the invitation is for, one of the configured types; an
  invitation stored before types existed reads as the first one.
  """
  type: String!
  updatedAt: String!
}

"""
Whether lapsed invitations (pending, past their expiry) are left out of a
list: `EXCLUDE` drops them and keeps every other invitation, `ONLY` keeps
only them.
"""
enum JanusInvitationLapsed {
  EXCLUDE
  ONLY
}

"""The order of a scope's invitations: by creation."""
enum JanusInvitationOrder {
  NEWEST
  OLDEST
}

"""
One page of a scope's invitations. `nextCursor` is null on the last page.
"""
type JanusInvitationPage {
  items: [JanusInvitation!]!
  nextCursor: String
  """
  How many invitations of the scope match the filters (`status`, `role`,
  `ref`), whatever the paging. Counted only when selected, and answered only on a page
  `invitations` returned (a page of your own has no count and fails). A `pending`
  invitation past `expiresAt` still counts, as it is still listed.
  """
  totalCount: Int!
}

"""
What a code names, for the page the invitee lands on: the content of the
invitation, nothing about who sent it or how it stands.
"""
type JanusInvitationPreview {
  email: String!
  expiresAt: String!
  id: ID!
  locale: String
  name: String!
  """
  Whether the page should ask for a password: false for a user type with no
  password, or somebody who already has an account with a proved e-mail and a
  password.
  """
  needsPassword: Boolean!
  """
  The name of the scope's organization (school, clinic, workspace), from the
  application's describeScope option; null when it names none or is not
  given.
  """
  organization: String
  role: WorkspaceRole!
  scope: String!
  """
  The user type the invitation is for, so the page can adapt its wording or
  flow to it.
  """
  type: String!
}

"""An invitation just issued or sent again."""
type JanusIssuedInvitation {
  """
  The code, a secret: null unless `answerCode` is on. It belongs in the
  invitation e-mail's link, never in a URL you log or a response a cache
  keeps (the response is `no-store`).
  """
  code: String
  invitation: JanusInvitation!
}

"""What a denied `@permission` answers."""
enum JanusPermissionDenial {
  """403: the object exists, and this user may not do this to it."""
  FORBIDDEN
  """404: the object is not told to exist. The default."""
  NOT_FOUND
}

"""A KSUID: 27 characters of base62."""
scalar KSUID @specifiedBy(url: "https://github.com/segmentio/ksuid")

"""The languages the API speaks."""
enum Language {
  EN
  FR
