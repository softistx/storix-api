union InvitationAcceptResult = InvitationSecondFactor | InvitationSignIn | InvitationSignedIn

"""
The invitation was accepted and a second factor is still to prove: confirm
it with the challenge. No session is open yet. The challenge is a secret:
never in a URL or a log.
"""
type InvitationSecondFactor {
  challenge: String!
  """When the challenge lapses, as an ISO-8601 string."""
  expiresAt: String!
  invitationId: ID!
  """
  What can answer the challenge: `totp` always, and `passkey` when the
  user holds one.
  """
  methods: [String!]!
  """
  The JSON text for `navigator.credentials.get({ publicKey })`, present
  exactly when `methods` holds `passkey`.
  """
  passkeyOptions: String
  scope: String!
}

"""
The address belongs to a proved user who already has a password (the password
given is ignored), or who has none and gave none. They are NOT signed in: an
invitation proves the inbox, not who holds the account. Send them to the
sign-in page.
"""
type InvitationSignIn {
  email: String!
  invitationId: ID!
  scope: String!
}

"""
The invitation was accepted and a session was opened: a new invitee, an
account whose e-mail was never proved, or a proved account with no password
yet, given one.
"""
type InvitationSignedIn {
  """When the session ends, as an ISO-8601 string."""
  expiresAt: String!
  invitationId: ID!
  newDevice: Boolean!
  role: String!
  scope: String!
  """
  The session token, only with `answerToken`; otherwise the session
  cookie is set and this is null.
  """
  token: String
  userId: ID!
}

"""Any JSON value."""
scalar JSON @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259")

"""A JSON object."""
scalar JSONObject @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc8259#section-4")

"""
A signed JSON Web Token in compact form. Its signature is not verified.
"""
scalar JWT @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc7519")

"""
An invitation into a scope (an organization, a team), as its owners see it.
The code is never here: `issueInvitation` and `resendInvitation` answer it
once.
"""
type JanusInvitation {
  acceptedAt: String
  acceptedBy: ID
  """Timestamps, as ISO-8601 strings."""
  createdAt: String!
  email: String!
  expiresAt: String!
  id: ID!
  """The id of the user who sent it, or null when the system issued it."""
  invitedBy: ID
  locale: String
  name: String!
  """
  The application's opaque reference the invitation was issued with (its own
  record), or null.
  """
  ref: String
  """The id of the user who last sent it again, or null."""
  resentBy: ID
  revokedAt: String
  """The id of the user who revoked it, or null."""
  revokedBy: ID
  role: String!
  """The organization (or any grouping) the invitation is into."""
  scope: String!
  """
  `pending`, `accepted` or `revoked`. A `pending` invitation past
  `expiresAt` is lapsed: it cannot be previewed or accepted, and
  `resendInvitation` gives it a new code.
  """
  status: String!
  """
  The user type the invitation is for, one of the configured types; an
  invitation stored before types existed reads as the first one.
  """
  type: String!
  updatedAt: String!
}

"""
Whether lapsed invitations (pending, past their expiry) are left out of a
list: `EXCLUDE` drops them and keeps every other invitation, `ONLY` keeps
only them.
"""
enum JanusInvitationLapsed {
  EXCLUDE
  ONLY
}

"""The order of a scope's invitations: by creation."""
enum JanusInvitationOrder {
  NEWEST
  OLDEST
}

"""
One page of a scope's invitations. `nextCursor` is null on the last page.
"""
type JanusInvitationPage {
  items: [JanusInvitation!]!
  nextCursor: String
  """
  How many invitations of the scope match the filters (`status`, `role`,
  `ref`), whatever the paging. Counted only when selected, and answered only on a page
  `invitations` returned (a page of your own has no count and fails). A `pending`
  invitation past `expiresAt` still counts, as it is still listed.
  """
  totalCount: Int!
}

"""
What a code names, for the page the invitee lands on: the content of the
invitation, nothing about who sent it or how it stands.
"""
type JanusInvitationPreview {
  email: String!
  expiresAt: String!
  id: ID!
  locale: String
  name: String!
  """
  Whether the page should ask for a password: false for a user type with no
  password, or somebody who already has an account with a proved e-mail and a
  password.
  """
  needsPassword: Boolean!
  """
  The name of the scope's organization (school, clinic, workspace), from the
  application's describeScope option; null when it names none or is not
  given.
  """
  organization: String
  role: String!
  scope: String!
  """
  The user type the invitation is for, so the page can adapt its wording or
  flow to it.
  """
  type: String!
}

"""An invitation just issued or sent again."""
type JanusIssuedInvitation {
  """
  The code, a secret: null unless `answerCode` is on. It belongs in the
  invitation e-mail's link, never in a URL you log or a response a cache
  keeps (the response is `no-store`).
  """
  code: String
  invitation: JanusInvitation!
}

"""What a denied `@permission` answers."""
enum JanusPermissionDenial {
  """403: the object exists, and this user may not do this to it."""
  FORBIDDEN
  """404: the object is not told to exist. The default."""
  NOT_FOUND
}

"""A KSUID: 27 characters of base62."""
scalar KSUID @specifiedBy(url: "https://github.com/segmentio/ksuid")

"""The languages the API speaks."""
enum Language {
  EN
  FR
}

"""A latitude in decimal degrees, from -90 to 90."""
scalar Latitude

"""A date and a time with no offset, such as 2024-03-10T10:15:30."""
scalar LocalDateTime

"""A time of day with no offset, such as 10:15 or 10:15:30."""
scalar LocalTime

"""A BCP 47 language tag in canonical form, such as fr-FR."""
scalar Locale @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc5646")

"""
A signed 64-bit integer, as a decimal string (a safe-integer number is accepted as input).
"""
scalar Long

"""A longitude in decimal degrees, from -180 to 180."""
scalar Longitude

"""
A MAC address: six hex pairs separated by colons (not the IEEE hyphen form).
"""
scalar MAC

"""A person in a workspace."""
type Member {
  """The account's opaque id."""
  accountId: ID!
  """The account's address; null when the account no longer exists."""
  email: EmailAddress
  id: ID!
  joinedAt: DateTime!
  """The account's name; null when the account no longer exists."""
  name: String
  role: WorkspaceRole!
}

"""A page of members."""
type MemberPage {
  nodes: [Member!]!
  pageInfo: PageInfo!
  """Every current member of the workspace."""
  totalCount: Int!
}

type Mutation {
  """
  Accepts the invitation `code` names: the code proves the invitee's inbox.
  A new invitee, an account whose e-mail was never proved, or a proved account
  with no password yet (given one) is signed in (the session cookie, or `token`
  with `answerToken`); a proved user who already has a password (the password
  given is ignored), or who has none and gave none, is answered
  `InvitationSignIn` and is not. INVITATION_INVALID (400) for a code that names no pending
  invitation, PASSWORD_REQUIRED (400) when a password is needed and absent.
  INVITATION_REFUSED (403) when the application's `beforeAccept` refused, with
  nothing written. A `code` over 43 characters or a `password` over 1024 is
  BAD_USER_INPUT (400, `field`), the code unspent.
  Open to anybody and not throttled here.
  """
  acceptInvitation(code: String!, password: String): InvitationAcceptResult!
  """
  The first code of the app: the factor is active, its ten recovery codes are answered once, the account's other sessions end. Needs a fresh session.
  """
  activateSecondFactor(code: String! @constraint(maxLength: 40)): RecoveryCodes!
  """
  Changes a member's role. Needs `members:manage` (OWNER, ADMIN) AND a fresh
  session (403 `auth.errors.step-up-required`: `requestStepUp` then
  `confirmStepUp`); only an OWNER may make or change an owner (403
  `auth.errors.forbidden`). 404 `members.errors.not-found` for a member of
  another workspace; 409 `workspaces.errors.last-owner` when it would leave
  no owner.
  """
  changeMemberRole(memberId: ID!, role: WorkspaceRole!): Member!
  """
  Ends a sign-up: the token of the verification mail and the password the
  visitor chose, posted together. Proves the address, sets the password and
  signs in. 400 `identity.errors.token-invalid`; 400
  `validation.errors.invalid-input` (`too-short` on `password`) with the link
  NOT spent.
  """
  completeSignUp(password: String! @constraint(maxLength: 1024), token: String! @constraint(maxLength: 200)): SignInPayload!
  """
  The code of the authenticator app, for the challenge signIn answered. 400 `identity.errors.second-factor-invalid` (with `attemptsLeft`); 400 `identity.errors.token-invalid`.
  """
  confirmSecondFactor(challenge: String! @constraint(maxLength: 200), code: String! @constraint(maxLength: 40)): SignInPayload!
  """
  Confirms a step-up and answers until when the session is fresh. 400 `identity.errors.second-factor-invalid`.
  """
  confirmStepUp(challenge: String! @constraint(maxLength: 200), code: String! @constraint(maxLength: 40)): DateTime!
  """
  Creates an empty team. Needs `teams:manage` (OWNER, ADMIN). 409
  `teams.errors.name-taken` (field `name`) when a team has that name, in any
  case.
  """
  createTeam(name: String! @constraint(minLength: 1, maxLength: 100)): Team!
  """
  Creates a workspace, with its own database, and makes the caller its OWNER.
  Needs a session. 409 `workspaces.errors.slug-taken`; 400
  `validation.errors.invalid-input` (a slug of 24 hexadecimal digits or an
  empty name); 429 `auth.errors.rate-limited`.
  """
  createWorkspace(input: CreateWorkspaceInput!): Workspace!
  """Deletes a team. Needs `teams:manage`. 404 `teams.errors.not-found`."""
  deleteTeam(id: ID!): Boolean!
  """
  Turns the factor off on a current code of the app, or on a recovery code when the phone is lost. Needs a fresh session.
  """
  disableSecondFactor(code: String! @constraint(maxLength: 40)): Boolean!
  """
  Starts a second factor. Needs a verified address (403 `identity.errors.email-unverified`) and a fresh session (403 `auth.errors.step-up-required`).
  """
  enrolSecondFactor: SecondFactorEnrolment!
  """
  Invites `email` into `scope` with `role`; the inviter is the signed-in
  user. Issuing again for an address that has a pending invitation revokes
  it and makes a new one. INVITATION_INVALID (`field`) for an input that
  cannot be kept, INVITATION_LIMIT (`maxActive`) when the scope is full,
  NOT_FOUND when `authorize` refuses. `ref` is an opaque reference to your
  own record (1 to 100 characters), answered back and usable as a filter of
  `invitations`. An argument over its maximum (`scope` 512, `email` 254, `name`,
  `role` and `ref` 100, `locale` 35 characters) is BAD_USER_INPUT (400, `field`)
  before `authorize` runs. `type` is the user type the invitee becomes: required when
  the instance configures several user types (null or absent means the
  instance's single type), INVITATION_INVALID
  (`field: 'type'`) when absent then, or when it names none of them.
  """
  issueInvitation(email: String!, locale: String, name: String!, ref: String, role: String!, scope: String!, type: String): JanusIssuedInvitation! @authenticated
  """
  Leaves the request's workspace. Any member; 409
  `workspaces.errors.last-owner` for the last owner, who promotes another
  owner first.
  """
  leaveWorkspace: Boolean!
  """
  A recovery code instead of the app's; each works once. Refused as confirmSecondFactor.
  """
  recoverSecondFactor(challenge: String! @constraint(maxLength: 200), recoveryCode: String! @constraint(maxLength: 40)): SignInPayload!
  """
  Ten new recovery codes on a current code of the app; the old ones end. Needs a fresh session.
  """
  regenerateRecoveryCodes(code: String! @constraint(maxLength: 40)): RecoveryCodes!
  """
  Removes a member from the workspace. Needs `members:manage` AND a fresh
  session (403 `auth.errors.step-up-required`: `requestStepUp` then
  `confirmStepUp`); removing an owner needs `owners:manage` (OWNER). To leave
  yourself, use `leaveWorkspace` (no step-up). 404 `members.errors.not-found`;
  409 `workspaces.errors.last-owner`.
  """
  removeMember(memberId: ID!): Boolean!
  """
  Renames a team. Needs `teams:manage`. 404 `teams.errors.not-found`; 409
  `teams.errors.name-taken` (field `name`) for another team's name, in any
  case; the team's own name in another case is allowed.
  """
  renameTeam(id: ID!, name: String! @constraint(minLength: 1, maxLength: 100)): Team!
  """
  Sends a password-reset link. True once accepted, whether or not the e-mail holds an account; 429 `auth.errors.rate-limited` past five per ten minutes for an address.
  """
  requestPasswordReset(email: String! @constraint(maxLength: 320)): Boolean!
  """
  Starts a step-up of the session: a code of the app, else a code mailed to the account. 401 `auth.errors.unauthenticated`.
  """
  requestStepUp: StepUpChallenge!
  """
  A new code and lifetime for a pending invitation, lapsed or not; the old
  code stops working. NOT_FOUND for an id of another scope,
  INVITATION_NOT_PENDING (409) when it is accepted or revoked.
  """
  resendInvitation(id: ID!, scope: String!): JanusIssuedInvitation! @authenticated
  """
  Sets a new password with the token of the reset mail and signs the account out everywhere. 400 `identity.errors.token-invalid`; 400 `validation.errors.invalid-input`.
  """
  resetPassword(password: String! @constraint(maxLength: 1024), token: String! @constraint(maxLength: 200)): Boolean!
  """
  Takes a pending invitation back. NOT_FOUND as `resendInvitation`,
  INVITATION_NOT_PENDING (409) when it is accepted or already revoked.
  """
  revokeInvitation(id: ID!, scope: String!): JanusInvitation! @authenticated
  """
  Replaces the team's members with these members (`Member.id`, repeats
  ignored; an empty list empties it). Needs `teams:manage`. 404
  `teams.errors.not-found`; 400 `teams.errors.member-unknown` (field
  `memberIds`) when an id is not a current member of the workspace, and then
  the team is left as it was.
  """
  setTeamMembers(id: ID!, memberIds: [ID!]! @constraint(maxItems: 1000)): Team!
  """
  Signs in with a password. 401 `identity.errors.invalid-credentials` for a
  wrong password, an unknown address and a deactivated account alike; 429
  `auth.errors.rate-limited`.
  """
